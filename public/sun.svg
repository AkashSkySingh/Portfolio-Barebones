<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="sunGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffaa00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8c00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <circle cx="50" cy="50" r="50" fill="white" />
  
  <!-- Sun rays (uniform length, like bike spokes) -->
  <g stroke="#ff8c00" stroke-width="5" stroke-linecap="round">
    <line x1="50" y1="50" x2="50" y2="10" />
    <line x1="50" y1="50" x2="78" y2="22" />
    <line x1="50" y1="50" x2="90" y2="50" />
    <line x1="50" y1="50" x2="78" y2="78" />
    <line x1="50" y1="50" x2="50" y2="90" />
    <line x1="50" y1="50" x2="22" y2="78" />
    <line x1="50" y1="50" x2="10" y2="50" />
    <line x1="50" y1="50" x2="22" y2="22" />
  </g>
  
  <!-- Sun core -->
  <circle cx="50" cy="50" r="28" fill="url(#sunGradient)" />
</svg>
